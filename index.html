<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wynne's Ink Lab</title>
    <script type="module" crossorigin src="/wynne-lab/assets/index-DKC5l-gS.js"></script>
    <link rel="stylesheet" crossorigin href="/wynne-lab/assets/index-CzizT7dk.css">
  
    <script data-id="dev-inject-monitor">
      (function() {
        const remote = "/sdk/dev-monitor.js";
        const separator = remote.includes('?') ? '&' : '?';
        const script = document.createElement('script');
        script.src = remote + separator + 't=' + Date.now();
        script.dataset.id = 'dev-inject-monitor-script';
        script.defer = true;
        if (!document.querySelector('[data-id="dev-inject-monitor-script"]')) {
          document.head.appendChild(script);
        }
      })();
    </script>
    <style>
      .work-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
      .work-img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; }
      .about-avatar { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- 精准匹配：只替换对应图片，不交叉覆盖 -->
    <script>
      window.onload = function() {
        // 1. About头像：仅匹配包含avatar的图片（严格匹配，不与其他图片冲突）
        const avatarImg = document.querySelector('img[src$="avatar.jpg"], .about-avatar');
        if (avatarImg) {
          avatarImg.src = 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/avatar.jpg';
        }

        // 2. 项目一：仅匹配covers/cover1-cover5（严格路径匹配）
        const coverPaths = [
          { key: 'covers/cover1.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover1.jpg' },
          { key: 'covers/cover2.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover2.jpg' },
          { key: 'covers/cover3.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover3.jpg' },
          { key: 'covers/cover4.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover4.jpg' },
          { key: 'covers/cover5.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover5.jpg' }
        ];
        coverPaths.forEach(item => {
          const imgs = document.querySelectorAll(`img[src*="${item.key}"], img[alt="项目一图片${item.key.slice(-5, -4)}"]`);
          imgs.forEach(img => img.src = item.url);
        });

        // 3. 项目二：仅匹配wechat_covers下的图片（严格路径匹配）
        const wechatPaths = [
          { key: 'wechat_covers/ai.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/ai.jpg' },
          { key: 'wechat_covers/digital.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/digital.jpg' },
          { key: 'wechat_covers/industry.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/industry.jpg' },
          { key: 'wechat_covers/info.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/info.jpg' },
          { key: 'wechat_covers/report.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/report.jpg' }
        ];
        wechatPaths.forEach(item => {
          const imgs = document.querySelectorAll(`img[src*="${item.key}"], img[alt="项目二图片${item.key.slice(-5, -4)}"]`);
          imgs.forEach(img => img.src = item.url);
        });

        // 4. 项目三/四：仅匹配work3/work4（严格后缀匹配）
        const workPaths = [
          { key: 'work3.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/work3.jpg' },
          { key: 'work4.jpg', url: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/work4.jpg' }
        ];
        workPaths.forEach(item => {
          const imgs = document.querySelectorAll(`img[src$="${item.key}"], img[alt="项目三图片"], img[alt="项目四图片"]`);
          imgs.forEach(img => img.src = item.url);
        });
      };
    </script>
  </body>
</html>
