<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wynne's Ink Lab</title>
<script type="module" crossorigin src="/wynne-lab/assets/index-DKC5l-gS.js"></script>
<link rel="stylesheet" crossorigin href="/wynne-lab/assets/index-CzizT7dk.css">

<!-- 精准修复头像铺满圆形，不影响任何其他样式 -->
<style>
  /* 只作用于头像，确保在手机/电脑都铺满圆圈 */
  img[src*="avatar"] {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    padding: 0 !important;
    margin: 0 !important;
    border-radius: 50% !important;
    display: block !important;
  }
</style>

<script>
(function() {
  const remote = "/sdk/dev-monitor.js";
  const s = document.createElement('script');
  s.src = remote + '?t=' + Date.now();
  s.defer = true;
  document.head.appendChild(s);
})();
</script>

</head>
<body>
<div id="root"></div>

<script>
const base = "https://wynne101099-cpu.github.io/wynne-lab";

const imgUrls = {
  avatar: base + "/avatar.jpg",
  cover1: base + "/covers/cover1.jpg",
  cover2: base + "/covers/cover2.jpg",
  cover3: base + "/covers/cover3.jpg",
  cover4: base + "/covers/cover4.jpg",
  cover5: base + "/covers/cover5.jpg",
  ai: base + "/wechat_covers/ai.jpg",
  digital: base + "/wechat_covers/digital.jpg",
  industry: base + "/wechat_covers/industry.jpg",
  info: base + "/wechat_covers/info.jpg",
  report: base + "/wechat_covers/report.jpg",
  work3: base + "/work3.jpg",
  work4: base + "/work4.jpg"
};

setTimeout(() => {
  for (const name in imgUrls) {
    document.querySelectorAll(`img[src*="${name}"]`).forEach(img => {
      img.src = imgUrls[name] + "?t=" + Date.now();
    });
  }
}, 800);
</script>
</body>
