<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wynne's Ink Lab</title>
    <script type="module" crossorigin src="/wynne-lab/assets/index-DKC5l-gS.js"></script>
    <link rel="stylesheet" crossorigin href="/wynne-lab/assets/index-CzizT7dk.css">
  
    <script data-id="dev-inject-monitor">
      (function() {
        const remote = "/sdk/dev-monitor.js";
        const separator = remote.includes('?') ? '&' : '?';
        const script = document.createElement('script');
        script.src = remote + separator + 't=' + Date.now();
        script.dataset.id = 'dev-inject-monitor-script';
        script.defer = true;
        if (!document.querySelector('[data-id="dev-inject-monitor-script"]')) {
          document.head.appendChild(script);
        }
      })();
    </script>
    <!-- 基础样式：保证图片排版美观 -->
    <style>
      .work-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
      .work-img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; }
      .about-avatar { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- 自动替换所有图片为正确地址 -->
    <script>
      window.onload = function() {
        // 1. About区域头像
        const avatarImg = document.querySelector('img[src*="avatar"], img[alt*="头像"], .about-avatar');
        if (avatarImg) {
          avatarImg.src = 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/avatar.jpg';
        }

        // 2. 项目一：cover1-cover5
        const coverImgs = {
          cover1: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover1.jpg',
          cover2: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover2.jpg',
          cover3: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover3.jpg',
          cover4: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover4.jpg',
          cover5: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/covers/cover5.jpg'
        };
        Object.keys(coverImgs).forEach(key => {
          const imgs = document.querySelectorAll(`img[src*="${key}"], img[alt*="${key}"]`);
          imgs.forEach(img => img.src = coverImgs[key]);
        });

        // 3. 项目二：wechat_covers下的图片
        const wechatImgs = {
          ai: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/ai.jpg',
          digital: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/digital.jpg',
          industry: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/industry.jpg',
          info: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/info.jpg',
          report: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/wechat_covers/report.jpg'
        };
        Object.keys(wechatImgs).forEach(key => {
          const imgs = document.querySelectorAll(`img[src*="${key}"], img[alt*="${key}"]`);
          imgs.forEach(img => img.src = wechatImgs[key]);
        });

        // 4. 项目三：work3、项目四：work4
        const workImgs = {
          work3: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/work3.jpg',
          work4: 'https://raw.githubusercontent.com/wynne101099-cpu/wynne-lab/main/work4.jpg'
        };
        Object.keys(workImgs).forEach(key => {
          const imgs = document.querySelectorAll(`img[src*="${key}"], img[alt*="${key}"]`);
          imgs.forEach(img => img.src = workImgs[key]);
        });
      };
    </script>
  </body>
</html>
